      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?

      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];

  <!-- iOS meta tags & icons -->

  <link rel="manifest" href="manifest.json">

  <style>
    /* Ecran de demarrage affiche AVANT Flutter : intro GesPro (bref) puis
       marque TerangaMobility, avec une barre de chargement. */
    html, body { margin: 0; padding: 0; height: 100%; background: #1E3A5F; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(160deg, #1E3A5F 0%, #15293F 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .4s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }

    /* Deux phases superposees, centrees, en fondu. */
    #boot .phase {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; transition: opacity .5s ease;
    }
    #boot .phase.show { opacity: 1; }

    /* Phase 1 — GesPro */
    #boot .gp-mark { color: #fff; font-size: 68px; font-weight: 800; letter-spacing: -1.5px; }
    #boot .gp-mark em { color: #C9A24B; font-style: normal; }
    #boot .gp-sub { color: #C9A24B; font-size: 16px; letter-spacing: 7px; font-weight: 700; margin-top: 12px; }
    #boot .gp-tag { color: rgba(255,255,255,.55); font-size: 15px; margin-top: 30px; letter-spacing: .5px; }

    /* Phase 2 — TerangaMobility (logo agrandi) */
    #boot .badge {
      width: 176px; height: 176px; border-radius: 38px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 22px 54px rgba(0,0,0,.45); margin-bottom: 30px;
    }
    #boot .badge img { width: 82%; height: 82%; object-fit: contain; }
    #boot .brand { color: #fff; font-size: 42px; font-weight: 800; letter-spacing: -.5px; }
    #boot .brand em { color: #C9A24B; font-style: normal; }
    #boot .scope { color: #C9A24B; font-size: 14px; letter-spacing: 4px; font-weight: 700; margin-top: 10px; }

    /* Barre de chargement indeterminee (bas de l'ecran) */
    #boot .loadbar {
      position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
      width: 190px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,.16); overflow: hidden;
    }
    #boot .loadbar::before {
      content: ''; position: absolute; top: 0; height: 100%; width: 45%;
      border-radius: 4px; background: #C9A24B;
      animation: slide 1.15s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes slide { 0% { left: -45%; } 100% { left: 100%; } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="phase show" id="phase-gespro">
      <div class="gp-mark">Ges<em>Pro</em></div>
      <div class="gp-sub">DIGITAL</div>
      <div class="gp-tag">vous présente</div>
    </div>
    <div class="phase" id="phase-teranga">
      <div class="badge"><img src="icons/Icon-512.png" alt="TerangaMobility"></div>
      <div class="brand">Teranga<em>Mobility</em></div>
      <div class="scope">PARTS &amp; VÉHICULES</div>
    </div>
    <div class="loadbar"></div>
  </div>

  <script>
    // Enchaine l'intro : GesPro (bref) puis TerangaMobility.
    setTimeout(function () {
      var g = document.getElementById('phase-gespro');
      var t = document.getElementById('phase-teranga');
      if (g) g.classList.remove('show');
      if (t) t.classList.add('show');
    }, 1300);
  </script>

  <script>
    // Anti-cache : desinscrit tout ancien service worker et vide ses caches.
    // Evite qu'un build precedent reste servi en boucle (probleme "nouvelle
    // version"). L'app est deployee sans service worker (--pwa-strategy=none).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
    }
  </script>

  <script>
    // Retire l'ecran de chargement des que Flutter affiche sa 1re image.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('hide');
      setTimeout(function () { boot.remove(); }, 400);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
